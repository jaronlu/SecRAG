# ══════════════════════════════════════════════════════════════════════
# SecRAG docker-compose — 一键启动
# ══════════════════════════════════════════════════════════════════════
#
# 快速开始：
#   1. cp .env.example .env  （填入 OPENAI_API_KEY）
#   2. docker compose up -d
#   3. 打开 http://localhost:8000
#
# 常用命令：
#   docker compose up -d          # 后台启动
#   docker compose logs -f        # 查看日志
#   docker compose down           # 停止并删除容器
#   docker compose build --no-cache  # 重新构建镜像
#
# 注意：首次启动时 sentence-transformers 会下载 bge-small-zh-v1.5 模型（~100MB），
#       模型缓存保存在 hf_cache volume 中，后续启动无需重新下载。

services:
  secrag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secrag
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # 覆盖 .env 中的路径，使用容器内路径
      - CHROMA_PERSIST_DIRECTORY=/data/chroma
      - AUDIT_DB_PATH=/data/audit.db
      - CONVERSATION_DB_PATH=/data/conversations.db
      - HF_HOME=/data/hf_cache
      - TRANSFORMERS_CACHE=/data/hf_cache
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      # Langfuse 观测配置透传（在 .env 中配置；显式声明便于按环境覆盖）
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_SAMPLE_RATE=${LANGFUSE_SAMPLE_RATE:-1.0}
      - LANGFUSE_CAPTURE_CONTENT=${LANGFUSE_CAPTURE_CONTENT:-false}
    volumes:
      # 持久化数据：ChromaDB、SQLite、模型缓存
      - secrag_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  secrag_data:
    driver: local
