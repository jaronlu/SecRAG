[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "secrag"
version = "0.1.0"
description = "机构内部投研知识平台 — Agentic RAG"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3,<2",
    "langchain-text-splitters>=1,<2",
    "langchain-huggingface>=1,<2",
    "langchain-chroma>=1,<2",
    "langchain-ollama>=1,<2",
    "langgraph>=1,<2",
    "chromadb>=1.5,<2",
    "sentence-transformers>=5,<6",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pandas>=2,<3",
    "langchain-unstructured>=1.0.1",
    "unstructured[docx,pdf]>=0.23.1",
    "fastapi>=0.100,<1",
    "langchain-openai>=1.3.3",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "sqlglot>=30.12.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    # 混合检索链路的每个检索步骤都叠加 BM25 + RRF，缺失只会静默降级为纯向量，
    # 因此列为主依赖而非 extra。
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "langfuse>=4.15.6,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.15,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint.per-file-ignores]
# scripts 先把项目根目录插入 sys.path 再 import 项目模块，E402 属预期结构
"scripts/**" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# basedpyright 配置在同目录 basedpyright.json：pyproject 同时保留 [tool.basedpyright]
# 与 [tool.pyright] 会导致 basedpyright 解析失败并回退默认严格模式
[tool.pyright]
# VSCode Pylance / pyright 读取此配置节
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
exclude = [".venv", "data", "node_modules"]
